platform=xilinx_u55n_gen3x4_xdma_2_202110_1

[connectivity]
nk=hbm_probe:1:hbm_probe_1

# One AXI master per group of four HBM pseudo-channels, so a single port has
# four banks' worth of parallelism behind it and the random addresses spread.
# Every HBM segment on this platform is on SLR0 (platforminfo), so the kernel
# wants to be there too -- see the pblock note below.
sp=hbm_probe_1.m0:HBM[0:3]
sp=hbm_probe_1.m1:HBM[4:7]
sp=hbm_probe_1.m2:HBM[8:11]
sp=hbm_probe_1.m3:HBM[12:15]
sp=hbm_probe_1.out:HBM[16]

slr=hbm_probe_1:SLR0

[clock]
# Pin it. This platform's kernel clock defaults to 300 MHz
# (ulp_ucs_aclk_kernel_00) and the link will silently target 300 and fail
# timing if it is not stated -- 00-START-HERE section 3.
#
# 250, not 300. HLS estimates the kernel at 301.83 MHz, which is 0.6% of margin
# against a 300 MHz target -- and HLS estimates the kernel logic alone, before
# the PR region's real routing. This project's record is that every target
# picked by guessing failed and every target picked from a measurement closed
# first time, and v++ writes NO bitstream when WNS < 0, so the downside is the
# whole build.
#
# Nothing being measured needs 300 MHz. MODE_CHASE reports latency in
# nanoseconds, which is clock-independent. MODE_STREAM is limited by having
# four AXI ports, not by the clock: 4 accesses/cycle at 250 MHz is already
# ~32 GB/s of HBM traffic, far short of the stack's ceiling, so the kernel is
# the bottleneck at either frequency and the shape of the result is the same.
freqHz=250000000:hbm_probe_1

[vivado]
prop=run.impl_1.STEPS.PHYS_OPT_DESIGN.IS_ENABLED=true
